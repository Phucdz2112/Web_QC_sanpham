services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    user: '65534:65534'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=3d, --storage.tsdb.retention.size=300MB]
    ports: ['127.0.0.1:9091:9090']
    volumes: ['./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro', prometheus_data:/prometheus]
    networks: [monitoring]
    mem_limit: 180m
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    user: '472:472'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      GF_SECURITY_ADMIN_USER: DTC255180105
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Generate .env first}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    ports: ['127.0.0.1:3002:3000']
    volumes: [grafana_data:/var/lib/grafana, './monitoring/grafana/provisioning:/etc/grafana/provisioning:ro', './monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro']
    networks: [monitoring]
    mem_limit: 220m
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    user: '65534:65534'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    command: [--nginx.scrape-uri=http://nginx:8080/nginx_status]
    networks: [monitoring]
  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    user: '65534:65534'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    command: [--config.my-cnf=/run/secrets/exporter.cnf]
    volumes: ['./secrets/exporter.cnf:/run/secrets/exporter.cnf:ro']
    networks: [backend, monitoring]
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    restart: unless-stopped
    privileged: true
    command: [--docker_only=true, --housekeeping_interval=30s]
    volumes: ['/:/rootfs:ro', '/var/run:/var/run:ro', '/sys:/sys:ro', '/var/lib/docker:/var/lib/docker:ro', '/var/lib/containerd:/var/lib/containerd:ro', '/dev/disk:/dev/disk:ro']
    devices: [/dev/kmsg:/dev/kmsg]
    networks: [monitoring]
    mem_limit: 180m
volumes:
  prometheus_data:
  grafana_data:
