pid /tmp/nginx.pid;
worker_processes auto;
error_log /logs/error.log warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format project escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /logs/access.log project;
  limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /nginx_status { stub_status; allow 127.0.0.1; allow 172.16.0.0/12; deny all; }
    location = /xmlrpc.php { deny all; }
    location ~ /\. { deny all; }
    location = /wp-login.php {
      limit_req zone=login burst=5 nodelay;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://wordpress:80;
    }
    location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://wordpress:80;
    }
  }
}
